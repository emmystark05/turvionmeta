<style>
  .slide-visual img {
    width: 100%;
    height: 100vh;
    object-fit: contain;
  }
  .slide-test img {
    width: 58.5vw;
    height: 110vh;
    object-fit: cover;
    margin-left: -25%;
  }

  .slide-text h2 {
    font-family: Raleway, sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 6vw, 36px);

    line-height: 1.15;
    position: relative;
    top: -180px;
    color: white;

  .dot {
    width: 222px;

  <div class="layout">

    <div class="panel-left" id="panelLeft">

      <div class="brand">
        <span class="brand-name">
          Turvion<span class="meta">Meta</span>
        </span>
      </div>

      <!-- Slides -->
      <div class="slides">
        
        <div class="slide active" data-index="0">
          <div class="slide-test">

              <img src="./images/anyone.png" alt="">
              <!-- <div class="bg-steps"></div> -->

          <div class="slide-text">
            <h2>Trading for anyone.Anywhere. <br/>Anytime.</h2>

        <div class="slide" data-index="1">

          <div class="slide-test1">

            <img src="./images/deposit.png" alt="">
          </div>
          </div>

          </div>
        </div>

        <div class="slide" data-index="2">
          <div class="slide-visual">
          <div class="slide-test1">

             <img src="./images/assets.png" alt="">
          </div>
          </div>
          <div class="slide-text">
            <h2>Trade Gold, Crypto, Forex, Oil,<br/> and more.</h2>
          </div>
        </div>

      </div>

      <!-- Slide indicators -->
      <div class="indicators">
        <button class="dot active" data-target="0" aria-label="Slide 1"></button>
        <button class="dot" data-target="1" aria-label="Slide 2"></button>
        <button class="dot" data-target="2" aria-label="Slide 3"></button>
      </div>

    </div>

        <div class="input-group">
